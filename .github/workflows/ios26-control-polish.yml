name: Apply iOS 26 Control Polish

on:
  push:
    paths:
      - '.github/workflows/ios26-control-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Polish slider and theme accents
        shell: python
        run: |
          from pathlib import Path
          import re

          slider_path = Path('src/elements/Slider.lua')
          s = slider_path.read_text()

          if '\t\tThumbSize = 13,' not in s:
              raise SystemExit('ThumbSize anchor missing')
          s = s.replace('\t\tThumbSize = 13,', '\t\tThumbSize = 16,', 1)

          old_track = 'Size = UDim2.new(1, not Slider.IsTextbox and -TotalSliderWidth or (-Slider.TextBoxWidth - 8), 0, 4),'
          new_track = 'Size = UDim2.new(1, not Slider.IsTextbox and -TotalSliderWidth or (-Slider.TextBoxWidth - 8), 0, 3),'
          if old_track not in s:
              raise SystemExit('Slider track anchor missing')
          s = s.replace(old_track, new_track, 1)
          s = s.replace('\t\tImageTransparency = 0.95,', '\t\tImageTransparency = 0.88,', 1)
          s = s.replace('\t\t\tImageTransparency = 0.1,', '\t\t\tImageTransparency = 0,', 1)

          normal_thumb = re.compile(
              r'Size = UDim2\.new\(\s*0,\s*Config\.Window\.NewElements and \(Slider\.ThumbSize \* 2\) or \(Slider\.ThumbSize \+ 2\),\s*0,\s*Config\.Window\.NewElements and \(Slider\.ThumbSize \+ 4\) or \(Slider\.ThumbSize \+ 2\)\s*\),'
          )
          s, normal_count = normal_thumb.subn('Size = UDim2.fromOffset(Slider.ThumbSize, Slider.ThumbSize),', s)
          if normal_count != 2:
              raise SystemExit(f'Expected 2 normal thumb size blocks, found {normal_count}')

          pressed_thumb = re.compile(
              r'Size = UDim2\.new\(\s*0,\s*\(Config\.Window\.NewElements and \(Slider\.ThumbSize \* 2\) or Slider\.ThumbSize\) \+ 8,\s*0,\s*Slider\.ThumbSize \+ 8\s*\),'
          )
          s, pressed_count = pressed_thumb.subn('Size = UDim2.fromOffset(Slider.ThumbSize + 3, Slider.ThumbSize + 3),', s, count=1)
          if pressed_count != 1:
              raise SystemExit(f'Expected pressed thumb size block, found {pressed_count}')
          s = s.replace('ImageTransparency = 0.85,', 'ImageTransparency = 0,', 1)

          slider_path.write_text(s)

          main_path = Path('main.lua')
          m = main_path.read_text()
          m = m.replace('Slider = Color3.fromHex("#929AA7")', 'Slider = Color3.fromHex("#7C8CFF")', 1)
          m = m.replace('Toggle = Color3.fromHex("#5DE7FF")', 'Toggle = Color3.fromHex("#34C759")', 1)
          m = m.replace('Toggle = Color3.fromHex("#55F1D6")', 'Toggle = Color3.fromHex("#34C759")', 1)
          m = m.replace('Toggle = Color3.fromHex("#A98BFF")', 'Toggle = Color3.fromHex("#34C759")', 1)
          m = m.replace('Slider = Color3.fromHex("#5DE7FF")', 'Slider = Color3.fromHex("#7C8CFF")', 1)
          m = m.replace('Slider = Color3.fromHex("#A98BFF")', 'Slider = Color3.fromHex("#7C8CFF")', 1)
          main_path.write_text(m)

      - name: Remove one-time workflow
        run: rm .github/workflows/ios26-control-polish.yml

      - name: Commit changes
        run: |
          git config user.name "MrRos3"
          git config user.email "114161345+MrRos3@users.noreply.github.com"
          git add src/elements/Slider.lua main.lua .github/workflows/ios26-control-polish.yml
          git commit -m "Polish slider and theme accents for iOS 26" || exit 0
          git push
