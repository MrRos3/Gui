name: Promote tested Salty Special

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/promote-salty-special.yml"

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VantaUI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote tested VantaTest sources and assets
        run: |
          set -euo pipefail
          mkdir -p assets src/components/window src/modules

          curl -fsSL "https://raw.githubusercontent.com/MrRos3/VantaTest/main/src/components/window/Init.lua" -o src/components/window/Init.lua
          curl -fsSL "https://raw.githubusercontent.com/MrRos3/VantaTest/main/src/components/window/Openbutton.lua" -o src/components/window/Openbutton.lua
          curl -fsSL "https://raw.githubusercontent.com/MrRos3/VantaTest/main/src/modules/Creator.lua" -o src/modules/Creator.lua
          curl -fsSL "https://raw.githubusercontent.com/MrRos3/VantaTest/main/assets/vanta-brand.jpeg" -o assets/vanta-brand.jpeg
          curl -fsSL "https://raw.githubusercontent.com/MrRos3/VantaTest/main/assets/salty-special.png" -o assets/salty-special.png
          curl -fsSL "https://raw.githubusercontent.com/MrRos3/VantaTest/main/main.lua" -o main.lua

          python - <<'PY'
          from pathlib import Path

          main = Path('main.lua')
          text = main.read_text()
          text = text.replace('MrRos3/VantaTest', 'MrRos3/VantaUI')
          main.write_text(text)

          p = Path('example.lua')
          s = p.read_text()
          s = s.replace('Theme = "Vanta AMOLED"', 'Theme = "Salty Special"', 1)

          branding_lines = [
              '    Branding = {',
              '        Name = "VANTA",',
              '        Image = VantaUI.Brand.Image,',
              '        Folder = "VantaUI",',
              '        IconSize = 24,',
              '        IconRadius = 7,',
              '        OpenButtonIconRadius = 8,',
              '        Intro = false,',
              '    },',
          ]
          marker = '    HideSearchBar = false,\n'
          if '    Branding = {' not in s:
              s = s.replace(marker, marker + '\n'.join(branding_lines) + '\n', 1)

          open_extra = [
              '        OnlyIcon = true,',
              '        CornerRadius = UDim.new(0, 11),',
              '        StrokeThickness = 2,',
              '        ImageZoom = 1,',
              '        Color = ColorSequence.new({',
              '            ColorSequenceKeypoint.new(0, Color3.fromHex("#000000")),',
              '            ColorSequenceKeypoint.new(1, Color3.fromHex("#000000")),',
              '        }),',
          ]
          marker = '        OnlyMobile = false,\n'
          if '        OnlyIcon = true,' not in s:
              s = s.replace(marker, marker + '\n'.join(open_extra) + '\n', 1)

          s = s.replace('Color3.fromHex("#171C27")', 'Color3.fromHex("#151116")', 1)
          salty_button = 'addThemeButton("Salty Special", "sparkles")\n'
          first_theme = 'addThemeButton("Vanta Smoked", "cloud-fog")\n'
          if salty_button not in s:
              s = s.replace(first_theme, salty_button + first_theme, 1)
          p.write_text(s)
          PY

          grep -q 'VantaUI.DefaultTheme = "Salty Special"' main.lua
          grep -q 'ElementBackgroundTransparency = 0.16' main.lua
          grep -q 'MrRos3/VantaUI/main/assets/salty-special.png' main.lua
          grep -q 'Theme = "Salty Special"' example.lua
          grep -q 'OnlyIcon = true' example.lua

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"

      - name: Setup Aftman
        uses: ok-nick/setup-aftman@v0.3.0

      - name: Install build tools
        run: aftman install

      - name: Build production runtime
        run: npm run build

      - name: Commit promoted release and remove helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore package-lock.json 2>/dev/null || true
          git rm .github/workflows/promote-salty-special.yml
          git add main.lua example.lua assets/vanta-brand.jpeg assets/salty-special.png src/components/window/Init.lua src/components/window/Openbutton.lua src/modules/Creator.lua dist/main.lua build/package.lua
          git commit -m "Promote Salty Special to VantaUI"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run build-gui.yml --ref main
