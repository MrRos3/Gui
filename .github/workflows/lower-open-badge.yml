name: Lower minimized VantaUI badge

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/lower-open-badge.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VantaUI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move minimized badge down 20px
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/window/Openbutton.lua')
          s = p.read_text()
          old = 'Position = UDim2.new(0.5, 0, 0, 6 + 44 / 2),'
          new = 'Position = UDim2.new(0.5, 0, 0, 26 + 44 / 2),'
          if old not in s:
              raise SystemExit('Open badge position target not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Setup Lua
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1"

      - name: Setup Aftman
        uses: ok-nick/setup-aftman@v0.3.0

      - name: Install build tools
        run: aftman install

      - name: Build runtime
        run: npm run build

      - name: Commit badge offset and clean helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore package-lock.json 2>/dev/null || true
          git rm .github/workflows/lower-open-badge.yml
          git add src/components/window/Openbutton.lua dist/main.lua build/package.lua
          git commit -m "Move minimized badge slightly lower [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
