name: Refresh VantaUI runtime path

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/runtime-cache-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VantaUI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to a new raw runtime path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.lua')
          s = p.read_text()
          old = 'https://raw.githubusercontent.com/MrRos3/VantaUI/main/dist/main.lua?v=' 
          new = 'https://raw.githubusercontent.com/MrRos3/VantaUI/refs/heads/main/dist/main.lua?v='
          if old not in s:
              raise SystemExit('runtime URL target not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit path refresh and clean helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-cache-refresh.yml
          git add main.lua
          git commit -m "Use alternate raw path for VantaUI runtime [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
