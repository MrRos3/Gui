name: Restore Runtime Compatibility

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/restore-runtime-compat.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gui
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good internal runtime wiring
        run: |
          git checkout 4e37620886518d5c86d8e4e93e452d9e44af3983 -- \
            src/Init.lua \
            src/components/KeySystem.lua \
            src/components/popup/Init.lua \
            src/components/ui/Dropdown.lua \
            src/components/ui/ScrollSlider.lua \
            src/components/ui/Toggle.lua \
            src/components/window/Dialog.lua \
            src/components/window/Init.lua \
            src/components/window/Tab.lua \
            src/elements/Code.lua \
            src/elements/Colorpicker.lua \
            src/elements/Group.lua \
            src/elements/HStack.lua \
            src/elements/Init.lua \
            src/elements/Section.lua \
            src/elements/Slider.lua \
            src/elements/Toggle.lua \
            src/elements/VStack.lua \
            src/elements/Viewport.lua \
            src/modules/Creator.lua \
            src/modules/Highlighter.lua \
            src/server/Icons.server.lua \
            src/themes/Init.lua

          rm -f .github/workflows/restore-runtime-compat.yml

      - name: Commit runtime repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/restore-runtime-compat.yml
          git commit -m "Restore internal runtime compatibility" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
