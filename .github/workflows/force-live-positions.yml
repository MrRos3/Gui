name: Force live VantaUI positions

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/force-live-positions.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VantaUI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch live notification and badge positions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.lua')
          s = p.read_text()

          marker = '''renameRuntimeGui()\nVantaUI:SetTheme(VantaUI.DefaultTheme)\n\nlocal BaseCreateWindow = VantaUI.CreateWindow'''
          insert = '''renameRuntimeGui()\nVantaUI:SetTheme(VantaUI.DefaultTheme)\n\nlocal function forceNotificationPosition()\n    if not VantaUI.NotificationGui then\n        return\n    end\n\n    local holder = VantaUI.NotificationGui:FindFirstChildWhichIsA("Frame")\n    if holder then\n        holder.Position = UDim2.new(1, -29, 0, 96)\n        holder.Size = UDim2.new(0, 300, 1, -116)\n    end\nend\n\nlocal function forceOpenButtonPosition(window)\n    if not window or window.Destroyed then\n        return\n    end\n\n    local openButtonMain = window.OpenButtonMain\n    local button = openButtonMain and openButtonMain.Button\n    local container = button and button.Parent\n    if container then\n        container.Position = UDim2.new(0.5, 0, 0, 88)\n    end\nend\n\nforceNotificationPosition()\n\nlocal BaseCreateWindow = VantaUI.CreateWindow'''
          if marker not in s:
              raise SystemExit('main wrapper insertion marker not found')
          s = s.replace(marker, insert, 1)

          old = '''    renameRuntimeGui()\n    return window\nend\n\nlocal BaseNotify = VantaUI.Notify'''
          new = '''    renameRuntimeGui()\n    forceOpenButtonPosition(window)\n    task.defer(function()\n        forceOpenButtonPosition(window)\n    end)\n    return window\nend\n\nlocal BaseNotify = VantaUI.Notify'''
          if old not in s:
              raise SystemExit('CreateWindow return marker not found')
          s = s.replace(old, new, 1)

          old_notify = '''function VantaUI:Notify(config)\n    config = config or {}\n    if config.Title == nil then\n        config.Title = "VantaUI"\n    end\n    return BaseNotify(self, config)\nend'''
          new_notify = '''function VantaUI:Notify(config)\n    config = config or {}\n    if config.Title == nil then\n        config.Title = "VantaUI"\n    end\n    forceNotificationPosition()\n    local notification = BaseNotify(self, config)\n    task.defer(forceNotificationPosition)\n    return notification\nend'''
          if old_notify not in s:
              raise SystemExit('Notify wrapper marker not found')
          s = s.replace(old_notify, new_notify, 1)

          p.write_text(s)
          PY

      - name: Commit wrapper fix and clean helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/force-live-positions.yml
          git add main.lua
          git commit -m "Force live notification and badge positions [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
