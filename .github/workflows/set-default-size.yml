name: Set VantaUI default size

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/set-default-size.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VantaUI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set default window size
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.lua')
          s = p.read_text()
          old = 'config.Size = UDim2.fromOffset(760, 520)'
          new = 'config.Size = UDim2.fromOffset(620, 420)'
          if old not in s:
              raise SystemExit('default size target not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit change and clean helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/set-default-size.yml
          git add main.lua
          git commit -m "Set VantaUI default window size to 620x420 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
