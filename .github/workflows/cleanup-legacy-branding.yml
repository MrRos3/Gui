name: Clean Legacy Branding

on:
  push:
    paths:
      - ".github/workflows/cleanup-legacy-branding.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gui
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy project branding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          skip_dirs = {'.git', 'node_modules'}
          skip_files = {'LICENSE'}
          replacements = [
              ('Footagesus', 'MrRos3'),
              ('Footages', 'MrRos3'),
              ('WindUI', 'Gui'),
              ('windui', 'gui'),
          ]

          changed = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              if path.name in skip_files:
                  continue
              try:
                  data = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              new = data
              for old, replacement in replacements:
                  new = new.replace(old, replacement)

              if new != data:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for item in changed:
              print(' -', item)
          PY

      - name: Remove one-time cleanup workflow
        run: rm -f .github/workflows/cleanup-legacy-branding.yml

      - name: Verify current tree branding
        run: |
          set +e
          matches=$(grep -RInE 'WindUI|windui|Footagesus|Footages' . \
            --exclude=LICENSE \
            --exclude-dir=.git \
            --exclude-dir=node_modules 2>/dev/null)
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "$matches"
            echo "Legacy branding still exists outside LICENSE."
            exit 1
          fi
          echo "No legacy branding remains outside LICENSE."

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove legacy branding from current tree [skip ci]"
          git push
